services:
  app:
    image: nginx:alpine
    container_name: code-training
    ports:
      - "${PORT:-8080}:80"
    # Bind-mount the source so edits show up on browser refresh — no rebuild needed.
    # For a self-contained image instead, run `docker compose -f docker-compose.build.yml up`.
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./shell.js:/usr/share/nginx/html/shell.js:ro
      - ./data:/usr/share/nginx/html/data:ro
    restart: unless-stopped