# Always revalidate so edits (and deploys) show up on a normal refresh
# instead of the browser reusing a stale app.js against a new index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }
}
